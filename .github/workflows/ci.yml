name: MemoBench offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline tests and CLI evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/memobench-ci
          python3 -m unittest discover tests 2>&1 | tee /tmp/memobench-ci/tests.log
          python3 -m memobench.cli run --distract 6 --out /tmp/memobench-ci/legacy 2>&1 | tee /tmp/memobench-ci/legacy.log
          python3 -m memobench.cli_v2 validate --dataset data/v0.2 2>&1 | tee /tmp/memobench-ci/data.log
          python3 -m memobench.cli_v2 validate --dataset data/v0.2-ai-reviewed 2>&1 | tee /tmp/memobench-ci/data-internal.log
          set +e
          python3 -m memobench.cli_v2 run --config configs/experiments/offline.json --out /tmp/memobench-ci/offline 2>&1 | tee /tmp/memobench-ci/v2.log
          fixture_exit=${PIPESTATUS[0]}
          set -e
          test "$fixture_exit" -eq 2
          python3 - <<'PYVERIFY'
          import json
          from pathlib import Path
          root = Path('/tmp/memobench-ci/offline')
          summary = json.loads((root / 'summary.json').read_text())
          assert summary['status'] == 'completed_with_errors' and summary['n_case'] == 24 and summary['failed_cases'] == 4
          attempts = [json.loads(p.read_text())['attempts'][-1] for p in (root / 'cases').glob('*.json')]
          assert len(attempts) == 24
          failed = [a for a in attempts if a.get('error')]
          assert len(failed) == 4
          assert all(a['error'] == {'stage': 'artifact_evidence', 'type': 'RuntimeError'} and a['results'] and all(r['task_status'] == 'blocked: trusted_tool_execution_unavailable' for r in a['results']) for a in failed)
          PYVERIFY
          python3 tools/check_release.py --root . 2>&1 | tee /tmp/memobench-ci/release.log
      - name: Keep actual offline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence-python-${{ matrix.python-version }}
          path: /tmp/memobench-ci
          retention-days: 14
